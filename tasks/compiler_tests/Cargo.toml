[package]
name = "compiler_tests"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
doctest = false

[[test]]
name = "compiler_tests_v3"
path = "test_v3.rs"

[[test]]
name = "compiler_tests_clusters"
path = "test_clusters.rs"

[[test]]
