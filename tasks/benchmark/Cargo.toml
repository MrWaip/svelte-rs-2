[package]
name = "benchmark"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true


[lib]
test = false
# bench = false
doctest = false

[[bench]]
name = "svelte_compiler"
harness = false

[[bench]]
name = "svelte_compiler_dev"
harness = false

[[bench]]
name = "svelte_compile_module"
harness = false

[[bench]]
name = "svelte_compile_module_dev"
harness = false

[[bin]]
name = "corpus_bench"
path = "src/bin/corpus_bench.rs"

[[bin]]
name = "profile"
path = "src/bin/profile.rs"

[[bin]]
name = "bench_once"
path = "src/bin/bench_once.rs"

[[bin]]
name = "profile_all"
path = "src/bin/profile_all.rs"

[[bin]]
name = "phase_bench"
path = "src/bin/phase_bench.rs"

[features]
default = []
codspeed = ["criterion2/codspeed"]

[dependencies]
svelte_compiler = { workspace = true }
svelte_parser = { workspace = true }
svelte_analyze = { workspace = true }
svelte_transform_client = { workspace = true }
svelte_codegen_client = { workspace = true }
svelte_types = { workspace = true }
svelte_sourcemap = { workspace = true }
svelte_span = { workspace = true }
svelte_ast = { workspace = true }
oxc_allocator = { workspace = true }
criterion2 = { workspace = true }
glob = { workspace = true }
rayon = { workspace = true }
mimalloc = { workspace = true }
