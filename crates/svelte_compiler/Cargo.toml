[package]
name = "svelte_compiler"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
svelte_ast = { workspace = true }
svelte_parser = { workspace = true }
svelte_analyze = { workspace = true }
svelte_transform_client = { workspace = true }
svelte_transform_server = { workspace = true }
svelte_diagnostics = { workspace = true }
svelte_codegen_client = { path = "../svelte_codegen_client" }
svelte_codegen_server = { workspace = true }
svelte_types = { workspace = true }
svelte_span = { workspace = true }
svelte_transform_css = { workspace = true }
svelte_sourcemap = { workspace = true }
oxc_allocator = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
