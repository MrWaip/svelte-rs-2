name: Canary N-API

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tarballs to npm after building them
        required: true
        type: boolean
        default: false
      dist_tag:
        description: npm dist-tag to publish under
        required: true
        type: string
        default: canary
      version:
        description: Optional exact npm version override
        required: false
        type: string

concurrency:
  group: canary-${{ github.workflow }}-${{ inputs.dist_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'
  RUST_CHANNEL: '1.94.1'

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      npm_version: ${{ steps.resolve.outputs.npm_version }}
    steps:
      - name: Resolve canary version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-canary.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using npm version: $VERSION"

  build-platform:
    name: Build Platform Package (${{ matrix.package_name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_name: platform-linux-x64-gnu
            package_dir: packages/svelte-rs2-linux-x64-gnu
            package_name: '@mrwaip/svelte-rs2-linux-x64-gnu'
          - runner: macos-15
            artifact_name: platform-darwin-arm64
            package_dir: packages/svelte-rs2-darwin-arm64
            package_name: '@mrwaip/svelte-rs2-darwin-arm64'
          - runner: macos-15-intel
            artifact_name: platform-darwin-x64
            package_dir: packages/svelte-rs2-darwin-x64
            package_name: '@mrwaip/svelte-rs2-darwin-x64'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-target: release
          channel: ${{ env.RUST_CHANNEL }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Stamp package versions
        run: node scripts/set-canary-version.mjs "${{ needs.version.outputs.npm_version }}"

      - name: Run smoke tests
        run: node packages/svelte-rs2/scripts/smoke.mjs

      - name: Build release addon
        run: cargo build -p napi_compiler --release --locked

      - name: Prepare current platform package
        run: node packages/svelte-rs2/scripts/prepare-platform-package.mjs

      - name: Pack current platform package
        id: pack
        shell: bash
        run: |
          OUTPUT=$(npm pack "./${{ matrix.package_dir }}" --pack-destination "$RUNNER_TEMP" --json)
          FILENAME=$(node -e "process.stdout.write(JSON.parse(process.argv[1])[0].filename)" "$OUTPUT")
          echo "tarball=$RUNNER_TEMP/$FILENAME" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Verify tarball contains native addon
        shell: bash
        run: tar -tzf "${{ steps.pack.outputs.tarball }}" | grep 'package/svelte-rs2.node'

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  build-main:
    name: Build Main Package
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Stamp package versions
        run: node scripts/set-canary-version.mjs "${{ needs.version.outputs.npm_version }}"

      - name: Pack main package
        id: pack
        shell: bash
        run: |
          OUTPUT=$(npm pack ./packages/svelte-rs2 --pack-destination "$RUNNER_TEMP" --json)
          FILENAME=$(node -e "process.stdout.write(JSON.parse(process.argv[1])[0].filename)" "$OUTPUT")
          echo "tarball=$RUNNER_TEMP/$FILENAME" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload main package tarball
        uses: actions/upload-artifact@v6
        with:
          name: main-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish npm packages
    if: ${{ inputs.publish }}
    needs:
      - version
      - build-platform
      - build-main
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download all package tarballs
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/publish

      - name: Show tarballs
        run: find "$RUNNER_TEMP/publish" -name '*.tgz' | sort

      - name: Verify npm authentication is configured
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not configured for this repository." >&2
            echo "Add NPM_TOKEN to GitHub Secrets or switch this workflow to npm Trusted Publishing." >&2
            exit 1
          fi

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          find "$RUNNER_TEMP/publish" -name '*.tgz' -not -path '*/main-package/*' -print0 \
            | while IFS= read -r -d '' tgz; do
                echo "Publishing $tgz"
                npm publish "$tgz" --tag "${{ inputs.dist_tag }}" --provenance
              done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          find "$RUNNER_TEMP/publish/main-package" -name '*.tgz' -print0 \
            | while IFS= read -r -d '' tgz; do
                echo "Publishing $tgz"
                npm publish "$tgz" --tag "${{ inputs.dist_tag }}" --provenance
              done
