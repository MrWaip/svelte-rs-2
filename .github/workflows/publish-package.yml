name: Publish Package

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish under
        required: true
        type: string
        default: canary
      version:
        description: Optional exact npm version override
        required: false
        type: string

concurrency:
  group: publish-package-${{ inputs.dist_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'
  RUST_CHANNEL: '1.97.1'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      npm_version: ${{ steps.resolve.outputs.npm_version }}
    steps:
      - name: Resolve canary version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-canary.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using npm version: $VERSION"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            label: darwin-x64
            runner: macos-latest
          - target: aarch64-apple-darwin
            label: darwin-arm64
            runner: macos-latest
            pgo: native
          - target: x86_64-pc-windows-msvc
            label: win32-x64-msvc
            runner: windows-latest
            pgo: native
          - target: aarch64-pc-windows-msvc
            label: win32-arm64-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            label: linux-x64-gnu
            runner: ubuntu-24.04
            cross: napi-cross
            pgo: native
          - target: aarch64-unknown-linux-gnu
            label: linux-arm64-gnu
            runner: ubuntu-24.04
            cross: zig
          - target: x86_64-unknown-linux-musl
            label: linux-x64-musl
            runner: ubuntu-24.04
            cross: zig
          - target: aarch64-unknown-linux-musl
            label: linux-arm64-musl
            runner: ubuntu-24.04
            cross: zig
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-target: release
          channel: ${{ env.RUST_CHANNEL }}
          targets: ${{ matrix.target }}
          components: ${{ matrix.pgo && 'llvm-tools-preview' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup zig
        if: ${{ matrix.cross == 'zig' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: ${{ matrix.cross == 'zig' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release addon
        shell: bash
        env:
          NAPI_TARGET: ${{ matrix.target }}
          NAPI_CROSS: ${{ matrix.cross }}
          PGO: ${{ matrix.pgo }}
        run: bash scripts/ci-build-addon.sh

      - name: Verify addon was produced
        shell: bash
        run: ls -la packages/svelte-rs2/compiler/native/svelte-rs2.*.node

      - name: Upload addon
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: packages/svelte-rs2/compiler/native/svelte-rs2.*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all addons
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Stamp package versions
        run: node scripts/set-canary-version.mjs "${{ needs.version.outputs.npm_version }}"

      - name: Assemble platform packages
        run: |
          node_modules/.bin/napi create-npm-dirs \
            --package-json-path packages/svelte-rs2/package.json \
            --npm-dir packages/svelte-rs2/npm
          node_modules/.bin/napi artifacts \
            --package-json-path packages/svelte-rs2/package.json \
            --output-dir artifacts \
            --npm-dir packages/svelte-rs2/npm

      - name: Verify every platform package carries its addon
        shell: bash
        run: |
          missing=0
          for dir in packages/svelte-rs2/npm/*/; do
            if ! ls "$dir"/svelte-rs2.*.node >/dev/null 2>&1; then
              echo "Missing native addon in $dir" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Verify main package carries the loader
        shell: bash
        run: |
          test -f packages/svelte-rs2/compiler/native/binding.cjs
          test -f packages/svelte-rs2/compiler/index.js
          test -f packages/svelte-rs2/compiler/index.d.ts

      - name: Verify npm authentication is configured
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not configured for this repository." >&2
            exit 1
          fi

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          for dir in packages/svelte-rs2/npm/*/; do
            echo "Publishing $dir"
            npm publish "$dir" --tag "${{ inputs.dist_tag }}" --provenance --access public
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          echo "Publishing packages/svelte-rs2"
          npm publish ./packages/svelte-rs2 --tag "${{ inputs.dist_tag }}" --provenance --access public
