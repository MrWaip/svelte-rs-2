[workspace]
members = ["crates/*", "tasks/*"]
exclude = ["tasks/compiler_bench"]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/MrWaip/svelte-rs-2"

[workspace.metadata.dylint]
libraries = [
    { path = "lints" },
]

[workspace.lints.rust]
deprecated = "allow"
# dead_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
module_name_repetitions = "allow"
absolute_paths = "warn"


[workspace.dependencies]
svelte_span = { path = "crates/svelte_span" }
svelte_ast = { path = "crates/svelte_ast" }
svelte_parser = { path = "crates/svelte_parser" }
svelte_diagnostics = { path = "crates/svelte_diagnostics" }
svelte_analyze = { path = "crates/svelte_analyze" }
svelte_codegen_client = { path = "crates/svelte_codegen_client" }
svelte_codegen_server = { path = "crates/svelte_codegen_server" }
svelte_transform_client = { path = "crates/svelte_transform_client" }
svelte_transform_server = { path = "crates/svelte_transform_server" }
svelte_emit_builders = { path = "crates/svelte_emit_builders" }
svelte_ast_builder = { path = "crates/svelte_ast_builder" }
svelte_compiler = { path = "crates/svelte_compiler" }
svelte_component_semantics = { path = "crates/svelte_component_semantics" }
svelte_types = { path = "crates/svelte_types" }
svelte_transform_css = { path = "crates/svelte_transform_css" }
svelte_css = { path = "crates/svelte_css" }
svelte_sourcemap = { path = "crates/svelte_sourcemap" }
napi_compiler = { path = "crates/napi_compiler" }
test_support = { path = "tasks/test_support" }

compact_str = "0.9.0"
glob = "0.3.2"
memchr = "2.8.0"
oxc_allocator = "0.117.0"
oxc_ast = "0.117.0"
oxc_ast_visit = "0.117.0"
oxc_codegen = "0.117.0"
oxc_index = "4.1.0"
oxc_parser = "0.117.0"
oxc_semantic = "0.117.0"
oxc_syntax = "0.117.0"
oxc_span = "0.117.0"
oxc_sourcemap = "6.0.2"
oxc_transformer = "0.117.0"
oxc_traverse = "0.117.0"
pretty_assertions = "1.4.1"
criterion2 = { version = "2.0.0" }
rstest = "0.24.0"
wasm-bindgen = "0.2.99"
serde-wasm-bindgen = "0.6.5"
rustc-hash = "2.1.1"
smallvec = "1"
bitflags = "2.6.0"
mimalloc = "0.1.52"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.test]
# Local development in this workspace repeatedly rebuilds large compiler crates.
# Favor incremental test rebuilds and cheaper debug info so `test-compiler` is fast.
incremental = true
debug = 0
